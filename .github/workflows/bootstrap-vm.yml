name: Bootstrap VM Toolchain

on:
  push:
    branches:
      - KIRCH-HARNESS-PILOT-SENTINELOPS-V1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SentinelOps
        uses: actions/checkout@v4
        with:
          path: sentinelops_source

      - name: Record externally verified harness baseline
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'd213ad56cea6a9a1fb3a56c159c448343d0d0777' > HARNESS_SHA

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, xml, ctype, curl, dom, fileinfo, filter, hash, openssl, pcre, pdo, tokenizer, pgsql, pdo_pgsql

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create Laravel 13 scaffold
        shell: bash
        run: |
          set -euo pipefail
          composer create-project laravel/laravel:^13.0 laravel_scaffold --prefer-dist --no-interaction
          cd laravel_scaffold
          composer require inertiajs/inertia-laravel --no-interaction
          npm install react react-dom @inertiajs/react @vitejs/plugin-react typescript --save
          php artisan --version
          composer show laravel/framework
          composer show inertiajs/inertia-laravel
          rm -f .env database/database.sqlite

      - name: Package PHP runtime
        shell: bash
        run: |
          set -euo pipefail
          php_bin="$(readlink -f "$(command -v php)")"
          php_root="$(dirname "$(dirname "$php_bin")")"
          mkdir -p php_runtime
          cp -a "$php_root"/. php_runtime/
          cp "$(command -v composer)" composer
          "$php_bin" -m > php_runtime/modules.txt
          "$php_bin" -v > php_runtime/version.txt

      - name: Package PostgreSQL runtime binaries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          pg_config --version
          pg_bindir="$(pg_config --bindir)"
          pg_root="$(dirname "$pg_bindir")"
          pg_sharedir="$(pg_config --sharedir)"
          mkdir -p postgresql_runtime postgresql_runtime/share
          cp -a "$pg_root"/. postgresql_runtime/
          cp -a "$pg_sharedir"/. postgresql_runtime/share/
          ldd "$pg_bindir/postgres" > postgresql_runtime/postgres-ldd.txt
          pg_config --version > postgresql_runtime/version.txt

      - name: Upload bootstrap bundle
        uses: actions/upload-artifact@v4
        with:
          name: sentinelops-bootstrap-bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          include-hidden-files: true
          path: |
            laravel_scaffold
            php_runtime
            composer
            postgresql_runtime
            HARNESS_SHA
